
services:
  node-app:
    build: .
    image: node-app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/node-boilerplate
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/node-app
    networks:
      - node-network

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=node-boilerplate
    ports:
      - '5433:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - node-network

volumes:
  dbdata:

networks:
  node-network:
    driver: bridge
