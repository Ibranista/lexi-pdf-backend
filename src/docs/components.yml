components:
  schemas:
    User:
      type: object
      description: As produced by `serializeUser`. Anonymous rows get "" for email and name.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        isEmailVerified:
          type: boolean
        isAnonymous:
          type: boolean
          description: true for the row POST /auth/device mints — an identity, not an account
        hasCompletedOnboarding:
          type: boolean
          description: what the client's root navigator gates the onboarding screen on
        interests:
          type: array
          items:
            type: string
        onboardedAt:
          type: integer
          nullable: true
          description: epoch ms, null until onboarding completes
      example:
        id: 9f0b0d3c-1f47-4a1a-9a2b-a2f1c0de8e11
        email: fake@example.com
        name: fake name
        role: USER
        isEmailVerified: false
        isAnonymous: false
        hasCompletedOnboarding: true
        interests: [textbooks, philosophy]
        onboardedAt: 1769000000000

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2020-05-12T16:18:04.793Z

    AuthTokens:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Token'
        refresh:
          $ref: '#/components/schemas/Token'

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

  responses:
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
